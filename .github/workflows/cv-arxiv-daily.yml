name: Run Arxiv Papers Daily

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0/12 * * *"

permissions:
  contents: write

jobs:
  build:
    name: Update RAG Papers Daily
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python Env
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install arxiv requests pyyaml

      - name: Run daily arxiv
        run: |
          python daily_arxiv.py

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Github Action Automatic Update RAG Arxiv Papers"
          file_pattern: "README.md docs/rag-arxiv-daily.json docs/rag-arxiv-daily-web.json docs/index.md"
          commit_user_name: "phuthiendao"
          commit_user_email: "phuthiendao@users.noreply.github.com"
